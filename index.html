<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Hours</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road Hours"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1747c9">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style id="css">
/* VOICE: upbeat, plain, teen-friendly; zero paperwork feel
   IDEA: a highway sign + dashboard — one big go button, hours as road
   PICTURE: the giant Start/Stop button and two road-stripe meters filling up
   COLOUR and TYPE: highway-sign blue field, lane-line yellow, moonlight for night; Overpass (Highway Gothic cousin)
   LAYOUT: blue drive band (button left, meters right; stacked on phones), then the log, then setup */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c1020);--ink:light-dark(#121726,#eef1fb);--mute:light-dark(#5a6275,#a3abc4);--line:light-dark(#e3e6ee,#252c46);--card:light-dark(#f3f5fa,#151b31);--blue:light-dark(#1747c9,#14318c);--blue2:light-dark(#0e2f92,#0a1d5c);--sun:#ffd23f;--moon:#c3d0ff;--red:#e5484d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
:root[data-skin=pink]{--blue:#e0457b;--blue2:#a3245a}
:root[data-skin=purple]{--blue:#7b3fe4;--blue2:#4c1fa3}
:root[data-skin=teal]{--blue:#0e8f84;--blue2:#07605a}
:root[data-skin=sunset]{--blue:#ef6a36;--blue2:#b0431a;--sun:#fff0b3}
:root[data-skin=black]{--blue:#1f222b;--blue2:#000}
.skins{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sk{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);padding:0;position:relative}
.sk[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg) inset}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Overpass,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
.band{padding:clamp(22px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance}
.top{padding-block:18px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:900;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--mute);font-size:14px}
.sync{margin-left:auto;font-size:13px;color:var(--mute)}
.drive{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:center}
.ctl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.today{font-size:22px;font-weight:800}
.lbl{font-size:13px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:8px 18px;border-radius:999px;border:2px solid rgba(255,255,255,.45);background:transparent;font-weight:600}
.chip[aria-pressed=true]{background:#fff;color:var(--blue2);border-color:#fff}
.go{position:relative;width:min(240px,70vw);aspect-ratio:1;border-radius:50%;border:8px solid #fff;background:var(--sun);color:#16181f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 14px 0 var(--blue2),0 18px 40px rgba(0,0,0,.25);transition:transform .08s}
.go:active{transform:translateY(6px);box-shadow:0 8px 0 var(--blue2)}
.go .gl{font-size:30px;font-weight:900;line-height:1}
.go .gs{font-size:14px;font-weight:600}
.go .clock{font-size:40px;font-weight:900;line-height:1}
.go.on{background:var(--red);color:#fff}
.go.on::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:3px solid var(--red);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){.go.on::after{animation:none;opacity:.5}}
.hint{margin:6px 0 0;font-size:14px;opacity:.85;max-width:32ch}
.meters{display:flex;flex-direction:column;gap:22px}
.m .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.m .big{font-size:clamp(40px,7vw,64px);font-weight:900;line-height:.9}
.m .of{font-size:17px;font-weight:600;opacity:.9}
.m .left{margin-left:auto;font-size:14px;opacity:.85;white-space:nowrap}
.road{position:relative;height:22px;border-radius:11px;background:var(--blue2);overflow:hidden}
.road i{display:block;height:100%;background:var(--sun);border-radius:11px;transition:width .4s}
.road::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 16px,transparent 16px 30px)}
.m.night .road i{background:var(--moon)}
.m.small .big{font-size:28px}
.m.small .road{height:12px}.m.small .road::after{display:none}
.m.small.over .road i{background:var(--red)}
.permit{font-size:14px;opacity:.9;border-top:1px solid rgba(255,255,255,.25);padding-top:14px}
.moon{width:14px;height:14px;vertical-align:-2px;fill:currentColor}
.loghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.loghead h2,.setup h2{font-size:32px;font-weight:900}
.loghead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;font-weight:700;border:2px solid var(--line);background:var(--bg)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rw{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none}
.rw:hover{background:var(--card)}
.rw .d{font-weight:800;font-size:17px}
.rw .t{color:var(--mute);font-size:14px}
.rw .dur{grid-column:2;grid-row:1/3;text-align:right;font-weight:900;font-size:22px;white-space:nowrap}
.rw .nt{display:block;font-size:13px;font-weight:600;color:var(--mute)}
.rw .warn{grid-column:1/3;font-size:13px;color:var(--red);font-weight:600}
.empty{padding:36px 16px;text-align:center;color:var(--mute);background:var(--card);border-radius:14px}
.fine{color:var(--mute);font-size:14px;max-width:70ch;margin:22px 0 0}
.fine a{color:inherit}
.setup{border-top:1px solid var(--line)}
.setup .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
input{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.sups{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 14px;border-radius:999px;background:var(--card);font-weight:600}
.tag button{width:36px;height:36px;border:0;background:none;border-radius:50%;font-size:18px;color:var(--mute)}
.addsup{display:flex;gap:8px}.addsup input{flex:1}
.sheet{position:fixed;inset:0;background:rgba(8,12,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:12px}
.sheet[hidden]{display:none}
.panel{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg);color:var(--ink);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:24px;font-weight:900}
.panel .chip{border-color:var(--line)}
.panel .chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.panel .chips{justify-content:flex-start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mute{color:var(--mute);font-weight:400;font-size:13px}
.pacts{display:flex;gap:8px;align-items:center}.pacts span{flex:1}
textarea{width:100%;min-height:200px;font:13px/1.4 ui-monospace,monospace;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:10;font-weight:600;max-width:calc(100% - 24px)}
.toast[hidden]{display:none}
.toast button{border:0;background:none;color:var(--sun);font-weight:800;min-height:36px}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}.setup .cols{grid-template-columns:minmax(0,1fr)}.sync{margin-left:0;width:100%}}
</style></head><body>
<div id="app"></div>
<script id="js">{
const LAT=33.236,LNG=-96.801; /* Prosper, TX — used for sunset/sunrise */
const GOAL=1800,NIGHT_GOAL=600,DAY_CAP=120;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOON='<svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 1.5a6.5 6.5 0 1 0 4 11.6A7 7 0 0 1 10.5 1.5z"/></svg>';
const app=$('#app');
const DEF={v:1,updated:0,drives:[],active:null,sups:['Dad','Mom'],lastSup:'Dad',permit:''};
let S=null;try{S=JSON.parse(localStorage.getItem('roadhours')||'null')}catch(e){}
S=Object.assign({},DEF,S||{});
let storeOK=true;try{localStorage.setItem('rh_t','1');localStorage.removeItem('rh_t')}catch(e){storeOK=false}
const sync=storeOK?'phone':'none';
const SKINS=[['road','Highway','#1747c9','#ffd23f'],['pink','Pink','#e0457b','#ffd23f'],['purple','Purple','#7b3fe4','#ffd23f'],['teal','Teal','#0e8f84','#ffd23f'],['sunset','Sunset','#ef6a36','#fff0b3'],['black','Black','#1f222b','#ffd23f']];
function applySkin(){const k=S.theme||'road';document.documentElement.dataset.skin=k;const m=document.querySelector('meta[name=theme-color]'),sk=SKINS.find(x=>x[0]===k);if(m&&sk)m.content=sk[2]}
applySkin();
let lastDel=null,toastT=null;

const sheet=document.createElement('div');sheet.className='sheet';sheet.hidden=true;document.body.appendChild(sheet);
const toast=document.createElement('div');toast.className='toast';toast.hidden=true;toast.setAttribute('role','status');document.body.appendChild(toast);

/* ---------- time helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const fmtT=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const fmtDay=t=>new Date(t).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dur=m=>m<60?m+'m':Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'');
const mins=d=>Math.max(0,Math.round((d.end-d.start)/6e4));
const R=Math.PI/180;
function sun(y,mo,da){
  const n=Date.UTC(y,mo,da,12)/864e5+2440587.5-2451545;
  const Js=n-LNG/360,M=(357.5291+0.98560028*Js)%360;
  const C=1.9148*Math.sin(M*R)+0.02*Math.sin(2*M*R)+0.0003*Math.sin(3*M*R);
  const L=(M+C+282.9372)%360;
  const Jt=2451545+Js+0.0053*Math.sin(M*R)-0.0069*Math.sin(2*L*R);
  const sd=Math.sin(L*R)*Math.sin(23.4397*R),cd=Math.cos(Math.asin(sd));
  const w=Math.acos((Math.sin(-0.833*R)-Math.sin(LAT*R)*sd)/(Math.cos(LAT*R)*cd))/R;
  const t=j=>(j-2440587.5)*864e5;
  return {rise:t(Jt-w/360),set:t(Jt+w/360)};
}
const sunFor=t=>{const d=new Date(t);return sun(d.getFullYear(),d.getMonth(),d.getDate())};
function daylight(s,e){let tot=0;const d0=new Date(s);for(let k=-1;k<=1;k++){const d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+k);const x=sun(d.getFullYear(),d.getMonth(),d.getDate());tot+=Math.max(0,Math.min(e,x.set)-Math.max(s,x.rise))}return tot}
const autoNight=(s,e)=>Math.max(0,Math.round((e-s-daylight(s,e))/6e4));
const nightMin=d=>Math.min(mins(d),d.night!=null?d.night:autoNight(d.start,d.end));
function totals(){
  const by={};for(const d of S.drives){const k=dkey(d.start),b=by[k]||(by[k]={m:0,n:0});b.m+=mins(d);b.n+=nightMin(d)}
  let all=0,night=0;for(const k in by){const b=by[k],c=Math.min(b.m,DAY_CAP);all+=c;night+=Math.min(b.n,c)}
  return {all,night,by};
}
const liveMin=()=>S.active?Math.floor((Date.now()-S.active.start)/6e4):0;
const clock=()=>{const s=S.active?Math.floor((Date.now()-S.active.start)/1e3):0;return Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};

/* ---------- saving ---------- */
function save(){S.updated=Date.now();try{localStorage.setItem('roadhours',JSON.stringify(S))}catch(e){}render()}
function busy(){const a=document.activeElement;return !sheet.hidden||(a&&a.tagName==='INPUT')}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- render ---------- */
function meter(cls,val,goal,label,left){const p=Math.min(100,val/goal*100);return `<div class="m ${cls}"><div class="row1"><span class="big">${val}</span><span class="of">${label}</span><span class="left">${left}</span></div><div class="road" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}"><i style="width:${p}%"></i></div></div>`}
function render(){
  const T=totals(),now=Date.now(),tk=dkey(now),todayM=((T.by[tk]||{}).m||0)+liveMin();
  const sn=sunFor(now),isNight=now<sn.rise||now>sn.set;
  const allH=(T.all/60).toFixed(1),nightH=(T.night/60).toFixed(1);
  const toGo=Math.max(0,GOAL-T.all),nToGo=Math.max(0,NIGHT_GOAL-T.night);
  const sups=S.sups.map(s=>`<button class="chip" data-a="sup" data-v="${esc(s)}" aria-pressed="${(S.active?S.active.sup:S.lastSup)===s}">${esc(s)}</button>`).join('');
  let permit='';
  if(S.permit){const p=new Date(S.permit+'T12:00');const e=new Date(p);e.setMonth(e.getMonth()+6);const days=Math.ceil((e-now)/864e5);
    permit=`<div class="permit">Learner permit since ${p.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}. Six-month mark: <b>${e.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</b>${days>0?` (${days} days to go)`:' (reached)'}.</div>`}
  const list=[...S.drives].sort((a,b)=>b.start-a.start);
  const rows=list.map(d=>{const m=mins(d),n=nightMin(d),over=T.by[dkey(d.start)].m>DAY_CAP;
    return `<li><button class="rw" data-a="edit" data-id="${esc(d.id)}"><span class="d">${fmtDay(d.start)}</span><span class="dur">${dur(m)}${n?`<span class="nt">${MOON} ${dur(n)} night</span>`:''}</span><span class="t">${fmtT(d.start)} – ${fmtT(d.end)} · with ${esc(d.sup||'—')}</span>${over?'<span class="warn">Over 2 hours that day, so only 2 hours count</span>':''}</button></li>`}).join('');
  app.innerHTML=`
<header class="top band"><div class="wrap">
  <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect x="7" y="7" width="30" height="30" rx="4" transform="rotate(45 22 22)" fill="#ffd23f" stroke="#121726" stroke-width="2.5"/><path d="M17 31c0-6 10-6 10-12v-5m-4 4 4-4 4 4" fill="none" stroke="#121726" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div><h1>Road Hours</h1><p>Texas learner log · 30 hours, 10 at night</p></div>
  <span class="sync">${sync==='phone'?'Saved on this phone':'Private browsing is on, so drives won\'t be saved'}</span>
</div></header>
<section class="drive band"><div class="wrap grid">
  <div class="ctl">
    <div class="today">${new Date(now).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
    <div class="lbl">Driving with</div>
    <div class="chips">${sups}</div>
    <button class="go${S.active?' on':''}" data-a="go" aria-label="${S.active?'Stop drive':'Start drive'}">
      ${S.active?`<span class="gs">Driving</span><span class="clock" id="clock">${clock()}</span><span class="gl" style="font-size:22px">Stop</span>`:`<span class="gl">Start</span><span class="gs">drive</span>`}
    </button>
    <p class="hint">${isNight?`${MOON} It's night now, so this counts toward night hours.`:`Sunset today ${fmtT(sn.set)}. Driving after that counts as night.`}</p>
  </div>
  <div class="meters">
    ${meter('',allH,30,'of 30 hours',toGo?dur(toGo)+' to go':'Done')}
    ${meter('night',nightH,10,'of 10 night hours',nToGo?dur(nToGo)+' to go':'Done')}
    <div class="m small${todayM>DAY_CAP?' over':''}"><div class="row1"><span class="big" id="todayM">${dur(todayM)}</span><span class="of">today, of the 2-hour daily max</span></div><div class="road"><i id="todayBar" style="width:${Math.min(100,todayM/DAY_CAP*100)}%"></i></div></div>
    ${permit}
  </div>
</div></section>
<section class="band"><div class="wrap">
  <div class="loghead"><h2>Drives</h2><div class="acts"><button class="btn" data-a="add">Add a missed drive</button><a class="btn" id="sms" href="#">Text the log</a><button class="btn" data-a="copy">Copy log</button></div></div>
  ${rows?`<ul class="list">${rows}</ul>`:'<div class="empty">No drives yet. Next time you get behind the wheel, tap <b>Start</b>.</div>'}
  <p class="fine">Texas requires 30 hours of supervised practice, at least 10 at night, with a licensed driver who is 21 or older and has at least a year of driving experience. Practice is limited to 2 hours a day, so time past 2 hours in one day isn't counted here. Night is figured from sunset to sunrise in Prosper, TX; type a number when editing a drive to override it. Tap any drive to fix it. Use Text the log to send it to a parent, and copy it onto TDLR form DES150N for DPS.</p>
</div></section>
<section class="band setup"><div class="wrap">
  <h2>Setup</h2>
  <div class="cols">
    <label>Date she got her learner permit<input type="date" id="permit" value="${esc(S.permit)}"></label>
    <div><div style="font-weight:600;font-size:15px">Who rides along</div>
      <div class="sups">${S.sups.map(s=>`<span class="tag">${esc(s)}<button data-a="rmsup" data-v="${esc(s)}" aria-label="Remove ${esc(s)}">×</button></span>`).join('')}</div>
      <form class="addsup" id="addsup"><input id="newsup" placeholder="Add a name" maxlength="30" aria-label="Add a name"><button class="btn">Add</button></form></div>
    <div><div style="font-weight:600;font-size:15px">Colors</div>
      <div class="skins">${SKINS.map(k=>`<button class="sk" data-a="skin" data-v="${k[0]}" aria-label="${k[1]}" title="${k[1]}" aria-pressed="${(S.theme||'road')===k[0]}" style="background:linear-gradient(135deg,${k[2]} 60%,${k[3]} 60%)"></button>`).join('')}</div></div>
    <div><div style="font-weight:600;font-size:15px">Backup or new phone</div>
      <p class="fine" style="margin:4px 0 10px">The log lives on this phone. Copy a backup now and then, and paste it here on a new phone to bring every drive along.</p>
      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="backup">Copy backup</button><button class="btn" data-a="restore">Restore a backup</button></div></div>
  </div>
</div></section>`;
  const sm=$('#sms');if(sm)sm.href=smsHref();
}
function smsHref(){return 'sms:&body='+encodeURIComponent(logText())}
function tick(){if(!S.active)return;const c=$('#clock');if(c)c.textContent=clock();const T=totals(),m=((T.by[dkey(Date.now())]||{}).m||0)+liveMin();const a=$('#todayM'),b=$('#todayBar');if(a)a.textContent=dur(m);if(b)b.style.width=Math.min(100,m/DAY_CAP*100)+'%'}

/* ---------- toast ---------- */
function say(msg,btn,fn){toast.innerHTML=`<span>${esc(msg)}</span>${btn?`<button>${esc(btn)}</button>`:''}`;toast.hidden=false;if(btn)toast.querySelector('button').onclick=()=>{toast.hidden=true;fn()};clearTimeout(toastT);toastT=setTimeout(()=>toast.hidden=true,5000)}

/* ---------- edit sheet ---------- */
let editId=null,fsup=null;
function openSheet(d){
  editId=d?d.id:null;const now=Date.now();
  const b=d||{start:now-30*6e4,end:now,sup:S.lastSup,night:null};fsup=b.sup;
  const names=S.sups.includes(b.sup)||!b.sup?S.sups:[...S.sups,b.sup];
  sheet.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="sht">
  <h3 id="sht">${d?'Edit drive':'Add a missed drive'}</h3>
  <label>Date<input type="date" id="fd" value="${dkey(b.start)}"></label>
  <div class="two"><label>Start time<input type="time" id="ft" value="${hm(new Date(b.start))}"></label>
  <label>Minutes<input type="number" id="fl" min="1" max="600" inputmode="numeric" value="${mins(b)}"></label></div>
  <div class="chips">${[15,30,45,60,90,120].map(m=>`<button type="button" class="chip" data-len="${m}">${dur(m)}</button>`).join('')}</div>
  <label>Night minutes <span class="mute">Leave blank to figure it from sunset (<span id="fa">${autoNight(b.start,b.end)}</span> min)</span><input type="number" id="fn" min="0" inputmode="numeric" placeholder="Auto" value="${b.night!=null?b.night:''}"></label>
  <div style="font-weight:600;font-size:15px">Driving with</div>
  <div class="chips" id="fs">${names.map(s=>`<button type="button" class="chip" data-fsup="${esc(s)}" aria-pressed="${s===fsup}">${esc(s)}</button>`).join('')}</div>
  <div class="pacts">${d?'<button class="btn danger" data-s="del">Delete</button>':''}<span></span><button class="btn" data-s="x">Cancel</button><button class="btn solid" data-s="ok">Save</button></div></div>`;
  sheet.hidden=false;$('#fl').focus();
}
function readSheet(){
  const [y,mo,da]=$('#fd').value.split('-').map(Number),[h,mi]=($('#ft').value||'12:00').split(':').map(Number);
  if(!y)return null;const len=Math.max(1,Math.min(600,parseInt($('#fl').value,10)||0));
  const start=new Date(y,mo-1,da,h,mi).getTime(),end=start+len*6e4,nv=$('#fn').value.trim();
  return {start,end,night:nv===''?null:Math.max(0,Math.min(len,parseInt(nv,10)||0)),sup:fsup||''};
}
function closeSheet(){sheet.hidden=true;sheet.innerHTML=''}
sheet.addEventListener('input',()=>{const r=readSheet();if(r)$('#fa').textContent=autoNight(r.start,r.end)});
sheet.addEventListener('click',e=>{
  if(e.target===sheet)return closeSheet();
  const l=e.target.closest('[data-len]');if(l){$('#fl').value=l.dataset.len;sheet.dispatchEvent(new Event('input'));return}
  const f=e.target.closest('[data-fsup]');if(f){fsup=f.dataset.fsup;sheet.querySelectorAll('[data-fsup]').forEach(x=>x.setAttribute('aria-pressed',x===f));return}
  const s=e.target.closest('[data-s]');if(!s)return;
  if(s.dataset.s==='x')return closeSheet();
  if(s.dataset.s==='del'){const i=S.drives.findIndex(x=>x.id===editId);if(i>=0){lastDel=S.drives.splice(i,1)[0];closeSheet();save();say('Drive deleted','Undo',()=>{S.drives.push(lastDel);save()})}return}
  if(s.dataset.s==='restore'){if(!s.dataset.sure){s.dataset.sure='1';s.textContent='Yes, replace my log';s.style.background='var(--red)';s.style.borderColor='var(--red)';return}try{const v=$('#rin').value.trim().replace(/^ROADHOURS:/,'');const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!Array.isArray(o.drives))throw 0;S=Object.assign({},DEF,o);closeSheet();save();say('Backup restored: '+S.drives.length+' drives')}catch(err){say('That code didn\'t work. Copy the whole thing and try again.')}return}
  if(s.dataset.s==='copy'){const ta=$('#cp');ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>say('Log copied'),()=>{})}catch(err){}return}
  const r=readSheet();if(!r)return;
  if(editId){Object.assign(S.drives.find(x=>x.id===editId),r)}else{S.drives.push(Object.assign({id:'d'+Date.now().toString(36)},r))}
  closeSheet();save();say(editId?'Drive updated':'Drive added');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

function logText(){
  const T=totals();const lines=[...S.drives].sort((a,b)=>a.start-b.start).map(d=>[new Date(d.start).toLocaleDateString('en-US'),fmtT(d.start),fmtT(d.end),dur(mins(d)),dur(nightMin(d)),d.sup||''].join(' | '));
  return ['Road Hours: Texas 30-hour behind-the-wheel log','Date | Start | End | Total | Night | Supervisor',...lines,'',`Counted: ${(T.all/60).toFixed(1)} of 30 hours, ${(T.night/60).toFixed(1)} of 10 night hours (max 2 hours per day)`].join('\n');
}

/* ---------- main events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='go'){
    if(!S.active){S.active={start:Date.now(),sup:S.lastSup};save()}
    else{const d={id:'d'+Date.now().toString(36),start:S.active.start,end:Date.now(),sup:S.active.sup,night:null};S.active=null;
      if(mins(d)<1){save();say('Under a minute, so nothing was logged')}
      else{S.drives.push(d);save();say('Logged '+dur(mins(d)),'Edit',()=>openSheet(S.drives.find(x=>x.id===d.id)))}}
  }
  else if(a==='skin'){S.theme=b.dataset.v;applySkin();save()}
  else if(a==='sup'){S.lastSup=b.dataset.v;if(S.active)S.active.sup=b.dataset.v;save()}
  else if(a==='edit'){const d=S.drives.find(x=>x.id===b.dataset.id);if(d)openSheet(d)}
  else if(a==='add')openSheet(null);
  else if(a==='rmsup'){if(S.sups.length>1){S.sups=S.sups.filter(s=>s!==b.dataset.v);if(S.lastSup===b.dataset.v)S.lastSup=S.sups[0];save()}else say('Keep at least one name')}
  else if(a==='backup'){
    const code='ROADHOURS:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const show=()=>{sheet.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="bkt"><h3 id="bkt">Backup code</h3><p class="mute">Save this somewhere safe, like a note or a text to yourself.</p><textarea id="cp" readonly>${esc(code)}</textarea><div class="pacts"><span></span><button class="btn" data-s="x">Close</button><button class="btn solid" data-s="copy">Copy</button></div></div>`;sheet.hidden=false};
    try{navigator.clipboard.writeText(code).then(()=>say('Backup copied. Paste it in a note or text.'),show)}catch(err){show()}
  }
  else if(a==='restore'){
    sheet.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="rst"><h3 id="rst">Restore a backup</h3><p class="mute">Paste the backup code. This replaces the ${S.drives.length} drive${S.drives.length===1?'':'s'} on this phone with the ones in the backup.</p><textarea id="rin" placeholder="ROADHOURS:..."></textarea><div class="pacts"><span></span><button class="btn" data-s="x">Cancel</button><button class="btn solid" data-s="restore">Restore</button></div></div>`;sheet.hidden=false;
  }
  else if(a==='copy'){
    const txt=logText();
    const done=()=>say('Log copied. Paste it anywhere.');
    const show=()=>{sheet.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="cpt"><h3 id="cpt">Your log</h3><textarea id="cp" readonly>${esc(txt)}</textarea><div class="pacts"><span></span><button class="btn" data-s="x">Close</button><button class="btn solid" data-s="copy">Copy</button></div></div>`;sheet.hidden=false};
    try{navigator.clipboard.writeText(txt).then(done,show)}catch(err){show()}
  }
});
app.addEventListener('change',e=>{if(e.target.id==='permit'){S.permit=e.target.value;e.target.blur();save()}});
app.addEventListener('submit',e=>{if(e.target.id!=='addsup')return;e.preventDefault();const i=$('#newsup'),v=i.value.trim();i.blur();if(v&&!S.sups.includes(v)){S.sups.push(v);save()}});

render();
setInterval(tick,1000);
setInterval(()=>{if(!busy())render()},60000);

}</script>
</body></html>
